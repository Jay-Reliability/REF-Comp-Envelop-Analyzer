<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comp Envelop Analyzer V3.0 ⚡ (Authored by JH Lee)</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #EEF2F6;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'NanumGothic', sans-serif;
    font-size: 9pt;
    color: #1F2933;
    overflow: hidden;
    user-select: none;
  }

  /* 윈도우 타이틀 바 (Web 환경에서 PyQt5 QMainWindow 타이틀 재현) */
  .window-titlebar {
    height: 30px;
    background: linear-gradient(90deg, #1E293B 0%, #334E68 100%);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 9.5pt;
    font-weight: 700;
    border-bottom: 1px solid #BCCCDC;
    flex-shrink: 0;
  }
  .window-titlebar .title-text {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .window-titlebar .window-controls {
    display: flex;
    gap: 6px;
  }
  .window-titlebar .win-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: inline-block;
  }

  /* 메인 레이아웃 (QMainWindow CentralWidget -> QHBoxLayout -> QSplitter) */
  .main-container {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: calc(100% - 30px);
    padding: 6px;
    gap: 0;
    overflow: hidden;
  }

  /* 좌측 컨트롤 패널 (QScrollArea FixedWidth 360) */
  .control-scroll {
    width: 360px;
    min-width: 280px;
    max-width: 520px;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    background-color: transparent;
    padding: 5px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }

  /* QSplitter 핸들 */
  .splitter-handle {
    width: 6px;
    cursor: col-resize;
    background-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .splitter-handle:hover, .splitter-handle.dragging {
    background-color: #CBD5E1;
  }
  .splitter-handle::after {
    content: "";
    width: 2px;
    height: 36px;
    background-color: #9FB3C8;
    border-radius: 1px;
  }

  /* QGroupBox 스타일 */
  .q-groupbox {
    position: relative;
    font-weight: bold;
    border: 1px solid #B8C2CC;
    border-radius: 8px;
    margin-top: 9px;
    padding: 14px 8px 8px 8px;
    background-color: #F8FAFC;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .q-groupbox-title {
    position: absolute;
    top: -9px;
    left: 10px;
    padding: 0 4px;
    background-color: #F8FAFC;
    color: #243B53;
    font-weight: bold;
    font-size: 9pt;
    line-height: 16px;
  }

  /* QLabel 스타일 */
  .q-label {
    color: #243B53;
    background-color: transparent;
    font-weight: normal;
    font-size: 9pt;
    line-height: 1.35;
    word-break: break-all;
  }
  .q-label.status-label {
    padding: 2px 2px 4px 2px;
    font-weight: 600;
  }
  .slot-label {
    color: #243B53;
    font-weight: 600;
    font-size: 9pt;
    margin-top: 2px;
  }

  /* QPushButton 기본 스타일 */
  .q-btn {
    background-color: #2F80ED;
    color: #FFFFFF;
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 9pt;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.12s ease;
    line-height: 1.2;
  }
  .q-btn:hover:not(:disabled) {
    background-color: #1C64D1;
  }
  .q-btn:active:not(:disabled) {
    background-color: #164E9E;
  }
  .q-btn:disabled {
    background-color: #A9C4EC;
    color: #EDF2FB;
    cursor: not-allowed;
  }

  /* 설정 적용 및 분석 실행 버튼 (녹색 + 노란 글씨) */
  .q-btn-run {
    background-color: #2E7D32;
    color: yellow;
    border: none;
    border-radius: 7px;
    padding: 6px 11px;
    font-weight: 700;
    font-size: 10pt;
    min-height: 35px;
    margin-top: 2px;
  }
  .q-btn-run:hover:not(:disabled) {
    background-color: #1B5E20;
  }
  .q-btn-run:active:not(:disabled) {
    background-color: #14481A;
  }
  .q-btn-run:disabled {
    background-color: #A5C7A7;
    color: #EFEFC0;
  }

  /* 종료 버튼 (적색 + 흰 글씨) */
  .q-btn-exit {
    background-color: #D92D20;
    color: #FFFFFF;
    border: none;
    border-radius: 7px;
    padding: 6px 11px;
    font-weight: 700;
    font-size: 9pt;
    min-height: 35px;
  }
  .q-btn-exit:hover:not(:disabled) {
    background-color: #B42318;
  }
  .q-btn-exit:active:not(:disabled) {
    background-color: #7A271A;
  }

  /* QComboBox 스타일 */
  .q-combobox {
    width: 100%;
    background-color: #FFFFFF;
    border: 1px solid #BCCCDC;
    border-radius: 6px;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 9pt;
    color: #1F2933;
    outline: none;
  }
  .q-combobox:disabled {
    background-color: #F0F4F8;
    color: #829AB1;
    cursor: not-allowed;
  }
  .q-combobox:focus {
    border-color: #2F80ED;
  }

  .slot-wrapper {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .slot-wrapper.hidden {
    display: none;
  }

  /* 우측 시각화 패널 */
  .visual-panel {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 6px;
    overflow: hidden;
    min-width: 0;
  }

  /* 우측 상단 정보 바 */
  .info-layout {
    display: flex;
    align-items: center;
    gap: 18px;
    min-height: 32px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .info-layout .info-item {
    color: #243B53;
    font-weight: 600;
    font-size: 9.5pt;
    white-space: nowrap;
  }
  .info-spacer {
    flex: 1;
  }
  .btn-save-graph {
    min-height: 30px;
    padding: 6px 12px;
  }

  /* 그래프 영역 (stretch=3) */
  .graph-section {
    flex: 3;
    display: flex;
    flex-direction: column;
    min-height: 240px;
    background-color: #FFFFFF;
    border: 1px solid #BCCCDC;
    border-radius: 6px;
    overflow: hidden;
  }

  /* Matplotlib NavigationToolbar2QT 재현 */
  .mpl-toolbar {
    height: 30px;
    background-color: #F8FAFC;
    border-bottom: 1px solid #D9E2EC;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 4px;
    flex-shrink: 0;
  }
  .mpl-tool-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 8.5pt;
    color: #243B53;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .mpl-tool-btn:hover {
    background-color: #E2E8F0;
    border-color: #CBD5E1;
  }
  .mpl-tool-btn.active {
    background-color: #DBEAFE;
    border-color: #2F80ED;
    color: #1D4ED8;
    font-weight: bold;
  }
  .mpl-sep {
    width: 1px;
    height: 18px;
    background-color: #CBD5E1;
    margin: 0 3px;
  }
  .mpl-coords {
    margin-left: auto;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 8.5pt;
    color: #486581;
  }

  .canvas-wrapper {
    flex: 1;
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #FFFFFF;
    overflow: hidden;
  }
  #envelopCanvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
  }

  /* 우측 하단 영역 (stretch=2, 좌: Data Analysis, 우: 데이터 테이블) */
  .bottom-layout {
    flex: 2;
    display: flex;
    flex-direction: row;
    gap: 8px;
    min-height: 185px;
    overflow: hidden;
  }

  /* 좌측 하단 : Data Analysis (stretch=1) */
  .analysis-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 260px;
    overflow: hidden;
  }
  .panel-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 28px;
    flex-shrink: 0;
  }
  .panel-header-row .panel-title {
    color: #243B53;
    font-size: 9pt;
    font-weight: 600;
  }
  .btn-small-export {
    padding: 5px 10px;
    font-size: 8.5pt;
  }

  .q-textedit {
    flex: 1;
    width: 100%;
    min-height: 140px;
    background-color: #FFFFFF;
    color: #102A43;
    border: 1px solid #BCCCDC;
    border-radius: 6px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 9.5pt;
    padding: 8px;
    resize: none;
    outline: none;
    overflow: auto;
    white-space: pre;
    line-height: 1.42;
    user-select: text;
  }

  /* 우측 하단 : Envelop 분석 데이터 테이블 (stretch=2) */
  .table-panel {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 340px;
    overflow: hidden;
  }
  .q-tablewidget-container {
    flex: 1;
    background-color: #FFFFFF;
    border: 1px solid #BCCCDC;
    border-radius: 6px;
    overflow: auto;
    position: relative;
    user-select: text;
  }
  .q-table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
    font-size: 8.5pt;
    color: #1F2933;
  }
  .q-table thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background-color: #F0F4F8;
    color: #243B53;
    font-weight: 700;
    border-bottom: 1px solid #BCCCDC;
    border-right: 1px solid #D9E2EC;
    padding: 4px 8px;
    text-align: center;
    white-space: nowrap;
  }
  .q-table tbody td {
    border-bottom: 1px solid #D9E2EC;
    border-right: 1px solid #D9E2EC;
    padding: 3px 8px;
    white-space: nowrap;
    text-align: right;
    height: 22px;
  }
  .q-table tbody td.col-left {
    text-align: left;
  }
  .q-table tbody td.col-center {
    text-align: center;
  }
  .q-table tbody tr:hover td {
    background-color: #F0F7FF;
  }
  .q-table tbody tr.row-fail td {
    background-color: #FFF5F5;
    color: #C53030;
  }

  /* 모달 다이얼로그 (QInputDialog / QMessageBox 재현) */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background-color: rgba(15, 23, 42, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .modal-backdrop.show {
    display: flex;
  }
  .q-dialog {
    background-color: #F8FAFC;
    border: 1px solid #9FB3C8;
    border-radius: 8px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    min-width: 340px;
    max-width: 520px;
    overflow: hidden;
  }
  .q-dialog-header {
    background-color: #243B53;
    color: #FFFFFF;
    padding: 8px 12px;
    font-weight: bold;
    font-size: 9.5pt;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .q-dialog-body {
    padding: 16px 16px 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    color: #1F2933;
    font-size: 9.5pt;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .q-dialog-footer {
    padding: 8px 16px 12px 16px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .q-btn-secondary {
    background-color: #E2E8F0;
    color: #1F2933;
  }
  .q-btn-secondary:hover:not(:disabled) {
    background-color: #CBD5E1;
  }

  /* 로딩 오버레이 */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background-color: rgba(15, 23, 42, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  }
  .loading-overlay.show {
    display: flex;
  }
  .loading-box {
    background-color: #FFFFFF;
    border: 1px solid #BCCCDC;
    border-radius: 8px;
    padding: 18px 26px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 280px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #D9E2EC;
    border-top-color: #2F80ED;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<!-- 상단 윈도우 타이틀 바 -->
<div class="window-titlebar">
  <div class="title-text">
    <span>Comp Envelop Analyzer V3.0 ⚡ (Authored by JH Lee)</span>
  </div>
  <div class="window-controls">
    <span class="win-dot" style="background:#F59E0B;"></span>
    <span class="win-dot" style="background:#10B981;"></span>
    <span class="win-dot" style="background:#EF4444;"></span>
  </div>
</div>

<!-- 메인 레이아웃 -->
<div class="main-container" id="mainContainer">

  <!-- ===== 좌측 패널 : 컨트롤 및 설정 ===== -->
  <div class="control-scroll" id="leftPanel">

    <!-- 1. 데이터 로드 그룹박스 -->
    <div class="q-groupbox">
      <div class="q-groupbox-title">1. 데이터 로드</div>
      <input type="file" id="csvFileInput" accept=".csv,text/csv" style="display:none;" />
      <button type="button" class="q-btn" id="btnLoadCsv">CSV 파일 로드</button>
      <div class="q-label status-label" id="lblCsvStatus">대기 중...</div>

      <button type="button" class="q-btn" id="btnSelectComp">Comp 유형 선택</button>
      <div class="q-label status-label" id="lblCompStatus">대기 중...</div>
    </div>

    <!-- 2. Envelop 분석 컬럼 선택 그룹박스 -->
    <div class="q-groupbox">
      <div class="q-groupbox-title">2. Envelop 분석 컬럼 선택</div>
      <div id="columnSlotsContainer" style="display:flex; flex-direction:column; gap:4px;"></div>
    </div>

    <!-- 3. 설정 적용 및 분석 실행 버튼 -->
    <button type="button" class="q-btn q-btn-run" id="btnRunAnalysis" disabled>설정 적용 및 분석 실행</button>

    <!-- 4. 종료 버튼 -->
    <button type="button" class="q-btn q-btn-exit" id="btnExit">❌ 종료</button>

    <div style="flex:1;"></div>
  </div>

  <!-- 좌우 분할 스플리터 -->
  <div class="splitter-handle" id="splitterHandle" title="드래그하여 좌측 패널 너비 조절"></div>

  <!-- ===== 우측 패널 : 시각화 및 데이터 테이블 ===== -->
  <div class="visual-panel">

    <!-- 상단 정보 표시 + 그래프 저장 버튼 -->
    <div class="info-layout">
      <div class="info-item" id="lblFileTitle">File : -</div>
      <div class="info-item" id="lblCompTitle">Comp Type : -</div>
      <div class="info-item" id="lblResultTitle">Envelop Result : -</div>
      <div class="info-spacer"></div>
      <button type="button" class="q-btn btn-save-graph" id="btnSaveGraph" disabled>📷 Envelop 그래프 JPG 저장</button>
    </div>

    <!-- 상단 윈도우 : Envelop 그래프 출력 영역 (11:8 비율) -->
    <div class="graph-section">
      <div class="mpl-toolbar">
        <button type="button" class="mpl-tool-btn" id="toolHome" title="원래 뷰로 복원 (Reset original view)">🏠 Home</button>
        <button type="button" class="mpl-tool-btn" id="toolBack" title="이전 뷰 (Back)">⬅ Back</button>
        <button type="button" class="mpl-tool-btn" id="toolForward" title="다음 뷰 (Forward)">➡ Forward</button>
        <div class="mpl-sep"></div>
        <button type="button" class="mpl-tool-btn" id="toolPan" title="드래그하여 이동 (Pan axes with left mouse)">✋ Pan</button>
        <button type="button" class="mpl-tool-btn" id="toolZoom" title="드래그하여 영역 확대 (Zoom to rectangle)">🔍 Zoom</button>
        <div class="mpl-sep"></div>
        <button type="button" class="mpl-tool-btn" id="toolSave" title="그래프 이미지 저장 (Save the figure)">💾 Save</button>
        <div class="mpl-coords" id="mplCoords"></div>
      </div>
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="envelopCanvas"></canvas>
      </div>
    </div>

    <!-- 하단 윈도우 : Data Analysis (좌) + Envelop 분석 데이터 테이블 (우) -->
    <div class="bottom-layout">

      <!-- [11단계] 좌측 하단 : Data Analysis -->
      <div class="analysis-panel">
        <div class="panel-header-row">
          <span class="panel-title">Data Analysis</span>
          <button type="button" class="q-btn btn-small-export" id="btnExportDashboard" disabled>CSV 내보내기</button>
        </div>
        <textarea class="q-textedit" id="txtAnalysisResult" readonly placeholder="CSV 파일 정보 및 Envelop Dashboard 결과가 여기에 표시됩니다."></textarea>
      </div>

      <!-- [12단계] 우측 하단 : Envelop 분석 데이터 테이블 -->
      <div class="table-panel">
        <div class="panel-header-row">
          <span class="panel-title" id="lblTableTitle">Envelop 분석 데이터 테이블</span>
          <button type="button" class="q-btn btn-small-export" id="btnExportData" disabled>CSV 내보내기</button>
        </div>
        <div class="q-tablewidget-container" id="tableContainer">
          <table class="q-table" id="dataTable">
            <thead id="dataTableHead"></thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Comp 유형 선택 모달 (QInputDialog.getItem 재현) -->
<div class="modal-backdrop" id="compDialogBackdrop">
  <div class="q-dialog">
    <div class="q-dialog-header">
      <span>Comp 유형 선택</span>
    </div>
    <div class="q-dialog-body">
      <div>분석할 Compressor 유형을 선택하세요.</div>
      <select class="q-combobox" id="compDialogSelect">
        <option value="Linear">Linear</option>
        <option value="Inverter">Inverter</option>
      </select>
    </div>
    <div class="q-dialog-footer">
      <button type="button" class="q-btn" id="compDialogOk">OK</button>
      <button type="button" class="q-btn q-btn-secondary" id="compDialogCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- 메시지 박스 모달 (QMessageBox 재현) -->
<div class="modal-backdrop" id="msgDialogBackdrop">
  <div class="q-dialog">
    <div class="q-dialog-header" id="msgDialogHeader">
      <span id="msgDialogTitle">알림</span>
    </div>
    <div class="q-dialog-body" id="msgDialogBody"></div>
    <div class="q-dialog-footer">
      <button type="button" class="q-btn" id="msgDialogOk">OK</button>
    </div>
  </div>
</div>

<!-- 대용량 CSV 처리 중 로딩 표시 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="q-label" id="loadingText" style="font-weight:bold;">CSV 파일 처리 중...</div>
  </div>
</div>

<script>
// ==============================================================================
// 상수 정의 : Comp 유형 / 분석 컬럼 슬롯 / 자동 인식용 JSON 코드 사전
// ("01_REF_Envelop_Analyzer_1.py" 와 100% 동일)
// ==============================================================================
const COMP_LINEAR = 'Linear';
const COMP_INVERTER = 'Inverter';

const GRAPH_W = 11;
const GRAPH_H = 8;
const MAX_TABLE_ROWS = 20000;

  const container = document.getElementById('columnSlotsContainer');
  container.innerHTML = '';
  for (const [key, title, linearOnly] of COLUMN_SLOTS) {
    const wrap = document.createElement('div');
